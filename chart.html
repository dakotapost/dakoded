<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Gained — dakoded.com</title>
<meta name="description" content="Daily knowledge gained with a running total.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --accent: #4ade80;
    --total: #ef4444;
    --bg: #0b0d10;
    --panel: #12161a;
    --panel-2: #171c21;
    --border: #232a31;
    --text: #c7ccd1;
    --muted: #8a919a;
    --dim: #5b6570;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 15%, #141a20 0%, #0b0d10 55%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 48px 24px;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
  }
  .wrap {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* Header */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .wordmark {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: #e7e9ea;
    letter-spacing: -0.02em;
    text-decoration: none;
    border-radius: 6px;
    transition: opacity .15s;
  }
  .wordmark:hover { opacity: 0.8; }
  .wordmark:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .wordmark .brackets { color: var(--accent); margin-right: 8px; }
  .wordmark .name { font-weight: 700; }
  .wordmark .tld { color: var(--dim); }

  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .home-btn:hover {
    background: rgba(74, 222, 128, 0.08);
    border-color: var(--accent);
    transform: translateX(-2px);
  }
  .home-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Heading */
  .heading h1 {
    margin: 0 0 8px;
    font-size: 30px;
    font-weight: 600;
    color: #f2f3f4;
    letter-spacing: -0.01em;
  }
  .heading p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }

  /* ---------- Layout: stat cards + chart ----------
     Default (taller than wide): four cards in a row above the chart.
     Wider than tall: cards move beside the chart (see media query below). */
  .layout {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .layout > * { min-width: 0; }
  .side { display: contents; }
  .stat { order: 1; }
  .terminal { order: 2; grid-column: 1 / -1; }

  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    overflow-wrap: anywhere;
  }
  .stat .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--dim);
    margin-bottom: 8px;
  }
  .stat .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #f2f3f4;
  }
  .stat .value.total { color: var(--total); }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Hide stat values until data arrives, without shifting the layout */
  .layout.loading .stat { visibility: hidden; }
  .layout.failed .side { display: none; }

  /* Chart panel */
  .terminal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .terminal-bar {
    padding: 12px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .terminal-title {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--dim);
  }
  .chart-body { padding: 20px 20px 16px; }
  .chart-box { position: relative; height: 440px; }
  .legend {
    display: flex;
    gap: 22px;
    justify-content: center;
    flex-wrap: wrap;
    padding-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .swatch-bar { width: 12px; height: 12px; border-radius: 3px; background: var(--accent); }
  .swatch-line { width: 18px; height: 3px; border-radius: 2px; background: var(--total); }

  .message {
    padding: 80px 24px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--muted);
  }
  .message.error { color: #ff7b72; }

  .footer-note {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--dim);
  }

  /* Small screens (portrait/tall layout): 2x2 cards */
  @media (max-width: 720px) {
    body { padding: 28px 16px; }
    .layout { grid-template-columns: repeat(2, 1fr); }
    .heading h1 { font-size: 24px; }
    .chart-box { height: 340px; }
  }

  /* Wider than tall: cards flank the chart. 15% | 70% | 15% */
  @media (min-aspect-ratio: 1/1) {
    .wrap { max-width: 1600px; }
    .layout {
      grid-template-columns: 15fr 70fr 15fr;
      align-items: center;
    }
    .side {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stat, .terminal { order: 0; }
    .terminal { grid-column: auto; }
    .stat { padding: 14px 14px; }
    .stat .label { font-size: 10px; letter-spacing: 0.05em; }
    .stat .value { font-size: clamp(15px, 1.7vw, 24px); }
    .chart-box { height: clamp(280px, 62vh, 680px); }
    .layout.failed { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">

    <div class="top">
      <a class="wordmark" href="index.html" aria-label="dakoded.com home">
        <span class="brackets">&lt;/&gt;</span><span class="name">dakoded<span class="tld">.com</span></span>
      </a>
      <a class="home-btn" href="index.html" aria-label="Back to the homepage">&larr; Back to home</a>
    </div>

    <div class="heading">
      <h1>Knowledge Gained</h1>
      <p>Daily knowledge gained, with the running total climbing over time.</p>
    </div>

    <div class="layout loading" id="layout">

      <div class="side side-left">
        <div class="stat">
          <div class="label">Running total</div>
          <div class="value total" id="stat-total">&ndash;</div>
          <div class="sub" id="stat-days"></div>
        </div>
        <div class="stat">
          <div class="label">Daily average</div>
          <div class="value" id="stat-avg">&ndash;</div>
          <div class="sub">per day</div>
        </div>
      </div>

      <div class="terminal">
        <div class="terminal-bar">
          <div class="terminal-title">knowledge.chart</div>
        </div>
        <div class="chart-body">
          <div class="message" id="message">loading data&hellip;</div>
          <div class="chart-box" id="chart-box" hidden>
            <canvas id="chart" role="img" aria-label="Bar chart of daily knowledge gained with a red line showing the running total"></canvas>
          </div>
          <div class="legend" id="legend" hidden>
            <span><i class="swatch-bar"></i>Daily value</span>
            <span><i class="swatch-line"></i>Running total</span>
          </div>
        </div>
      </div>

      <div class="side side-right">
        <div class="stat">
          <div class="label">Best day</div>
          <div class="value" id="stat-best">&ndash;</div>
          <div class="sub" id="stat-best-day"></div>
        </div>
        <div class="stat">
          <div class="label">Latest day</div>
          <div class="value" id="stat-last">&ndash;</div>
          <div class="sub" id="stat-last-day"></div>
        </div>
      </div>

    </div>

    <div class="footer-note">hover or tap the chart for exact values</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    const GREEN = '#4ade80';
    const RED = '#ef4444';
    const GRID = '#232a31';
    const MUTED = '#8a919a';

    const fmt = (n, max = 3) =>
      Number(n).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: max });

    const layout = document.getElementById('layout');
    const msg = document.getElementById('message');

    fetch('data/chart.json', { cache: 'no-store' })
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(rows => {
        if (!Array.isArray(rows) || rows.length === 0) throw new Error('No data');

        rows = rows
          .map(r => ({ day: Number(r.day), value: Number(r.knowledgeGained) || 0 }))
          .sort((a, b) => a.day - b.day);

        const labels = rows.map(r => r.day);
        const daily = rows.map(r => r.value);
        let sum = 0;
        const running = daily.map(v => (sum += v));

        // ---- Stats ----
        const best = rows.reduce((a, b) => (b.value > a.value ? b : a));
        const last = rows[rows.length - 1];
        document.getElementById('stat-total').textContent = fmt(sum);
        document.getElementById('stat-days').textContent = 'over ' + rows.length + ' days';
        document.getElementById('stat-avg').textContent = fmt(sum / rows.length);
        document.getElementById('stat-best').textContent = fmt(best.value);
        document.getElementById('stat-best-day').textContent = 'day ' + best.day;
        document.getElementById('stat-last').textContent = fmt(last.value);
        document.getElementById('stat-last-day').textContent = 'day ' + last.day;
        layout.classList.remove('loading');

        // ---- Chart ----
        msg.hidden = true;
        document.getElementById('chart-box').hidden = false;
        document.getElementById('legend').hidden = false;

        Chart.defaults.color = MUTED;
        Chart.defaults.font.family = "'JetBrains Mono', monospace";
        Chart.defaults.font.size = 11;

        const ctx = document.getElementById('chart').getContext('2d');
        const barFill = ctx.createLinearGradient(0, 0, 0, 440);
        barFill.addColorStop(0, 'rgba(74, 222, 128, 0.85)');
        barFill.addColorStop(1, 'rgba(74, 222, 128, 0.25)');

        new Chart(ctx, {
          data: {
            labels,
            datasets: [
              {
                type: 'bar',
                label: 'Daily value',
                data: daily,
                yAxisID: 'yDaily',
                backgroundColor: barFill,
                hoverBackgroundColor: GREEN,
                borderColor: GREEN,
                borderWidth: 1,
                borderRadius: 4,
                borderSkipped: false,
                order: 2
              },
              {
                type: 'line',
                label: 'Running total',
                data: running,
                yAxisID: 'yTotal',
                borderColor: RED,
                backgroundColor: RED,
                borderWidth: 3,
                tension: 0.3,
                pointRadius: 0,
                pointHoverRadius: 6,
                pointHoverBorderWidth: 2,
                pointHoverBorderColor: '#0b0d10',
                order: 1
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            animation: { duration: 900, easing: 'easeOutQuart' },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#171c21',
                borderColor: GRID,
                borderWidth: 1,
                titleColor: '#f2f3f4',
                bodyColor: '#c7ccd1',
                padding: 12,
                cornerRadius: 8,
                displayColors: true,
                callbacks: {
                  title: items => 'Day ' + items[0].label,
                  label: item => ' ' + item.dataset.label + ': ' + fmt(item.parsed.y)
                }
              }
            },
            scales: {
              x: {
                title: { display: true, text: 'Day', color: MUTED },
                grid: { display: false },
                ticks: { autoSkip: true, maxTicksLimit: 25 }
              },
              yDaily: {
                position: 'left',
                beginAtZero: true,
                title: { display: true, text: 'Daily value', color: GREEN },
                grid: { color: GRID },
                ticks: { color: GREEN, callback: v => fmt(v, 1) }
              },
              yTotal: {
                position: 'right',
                beginAtZero: true,
                title: { display: true, text: 'Running total', color: RED },
                grid: { drawOnChartArea: false },
                ticks: { color: RED, callback: v => fmt(v, 1) }
              }
            }
          }
        });
      })
      .catch(err => {
        console.error(err);
        layout.classList.remove('loading');
        layout.classList.add('failed');
        msg.textContent = "couldn't load chart data. try again later.";
        msg.classList.add('error');
      });
  </script>
</body>
</html>
